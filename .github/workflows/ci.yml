name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One red leg must not hide the others: the whole point of this suite is
      # to know exactly which scenario broke.
      fail-fast: false
      matrix:
        include:
          # The declared floor is 3.9, so the floor gets tested for real.
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          # Windows is not a courtesy leg: the crash this suite was built to
          # prevent (a legacy console code page killing the audit mid-probe and
          # exiting 1, the code reserved for "findings found") is a Windows
          # failure mode, and one of the tests pins the console to cp936.
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package the way a user would
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Console script must be on PATH and report a version
        run: relaycheck --version

      - name: Self-test against the eight mock relays
        run: python -u tests/test_mock_relay.py

      - name: Same suite under pytest
        run: |
          python -m pip install pytest
          python -m pytest -q
